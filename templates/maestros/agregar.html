{% extends "layout.html" %}

{% block container %}

{% if errors %}
    <ul>
    {% for campo, mensajes in errors.items() %}
        {% for mensaje in mensajes %}
            <li>{{ mensaje }}</li>
        {% endfor %}
    {% endfor %}
    </ul>
{% endif %}

<div class="flex justify-center align-center">
    <form class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg" method="post" action="{{ url_for('maestros.agregar') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="relative z-0 w-full mb-5 group">
            <input type="number" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500 peer" placeholder=" " name="matricula" required/>
            <label class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-500">Matricula</label>
        </div>

        <div class="relative z-0 w-full mb-5 group">
            <input type="text" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500 peer" placeholder=" " name="nombre" required/>
            <label class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-500">Nombre</label>
        </div>

        <div class="relative z-0 w-full mb-5 group">
            <input type="text" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500 peer" placeholder=" " name="apellidos" required/>
            <label class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-500">Apellidos</label>
        </div>

        <div class="relative z-0 w-full mb-5 group">
            <input type="text" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500 peer" placeholder=" " name="especialidad" required/>
            <label class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-500">Especialidad</label>
        </div>

        <div class="relative z-0 w-full mb-5 group">
            <input type="email" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500 peer" placeholder=" " name="email" required/>
            <label class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-500">Email</label>
        </div>

        <button class="text-white bg-blue-600 hover:bg-blue-700 rounded-lg text-sm px-4 py-2.5">
            Crear
        </button>
    </form>
</div>

{% endblock %}

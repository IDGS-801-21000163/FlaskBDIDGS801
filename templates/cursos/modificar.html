{% extends "layout.html" %}
{% block container %}

<div class="flex justify-center align-center">
    <form class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg" method="post" action="{{ url_for('cursos.modificar') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="id" value="{{ curso.id }}">

        <div class="relative z-0 w-full mb-5 group">
            <input type="text" value="{{ curso.nombre }}" name="nombre" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500 peer" placeholder=" " required />
            <label class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0]">Nombre del curso</label>
        </div>

        <div class="relative z-0 w-full mb-5 group">
            <input type="text" value="{{ curso.descripcion }}" name="descripcion" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500 peer" placeholder=" " required />
            <label class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0]">Descripcion</label>
        </div>

        <div class="relative z-0 w-full mb-5 group">
            <select name="maestro_id" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:ring-0 focus:border-blue-500" required>
                {% for maestro in maestros %}
                <option value="{{ maestro.matricula }}" {% if maestro.matricula == curso.maestro_id %}selected{% endif %}>
                    {{ maestro.matricula }} - {{ maestro.nombre }} {{ maestro.apellidos }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button class="text-white bg-blue-600 hover:bg-blue-700 rounded-lg text-sm px-4 py-2.5">Modificar</button>
    </form>
</div>

{% endblock %}
